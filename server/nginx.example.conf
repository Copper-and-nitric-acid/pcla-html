# PCLA API · Nginx 示例
# 站点根目录同时放静态站、api/ 和 storage/

server {
    listen 80;
    server_name pcla.example.com;
    root /var/www/pcla;
    index index.html;

    # 静态站
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 内部文件不允许从 HTTP 访问
    location ~ ^/api/(config|db|helpers|_bootstrap)\.php$ {
        deny all;
        return 404;
    }

    # PHP
    location ~ \.php$ {
        try_files $uri =404;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # 数据库与日志不允许直接访问
    location ^~ /storage/ {
        deny all;
        return 404;
    }

    # 隐藏文件
    location ~ /\.(?!well-known) {
        deny all;
    }
}
